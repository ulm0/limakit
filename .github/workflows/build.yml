# Builds everything natively on GitHub's arm64 runners and publishes to GHCR (ghcr.io/<owner>/limakit/*):
#   kernel  kernel:<ver>-<hash> (rebuilt only when kernel/limakit.config or kernel/build.sh change) and kernel:<ver>
#   lima    the lima-init service image: lima:<sha>, lima:latest (main), lima:<tag> — limakit.yml uses kernel:<ver> and lima:latest
#   image   out/limakit-kernel + out/limakit-squashfs.img, as an artifact; attached to a release on v* tags
# Booting can't be tested here (VZ needs nested virtualization); run test/run.sh on a Mac.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/ulm0/limakit # what limakit.yml references

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -S warning kernel/build.sh lima-init/entrypoint.sh lima-init/shims/* test/run.sh

  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.key.outputs.version }}
      image: ${{ steps.key.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: key # the kernel version limakit.yml uses + a hash of what the build depends on
        run: |
          version=$(sed -n 's|^  image: ghcr.io/ulm0/limakit/kernel:\(.*\)$|\1|p' limakit.yml)
          hash=$(cat kernel/limakit.config kernel/build.sh | sha256sum | cut -c1-12)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "image=$REGISTRY/kernel:$version-$hash" >>"$GITHUB_OUTPUT"
      - id: cached
        run: docker manifest inspect "${{ steps.key.outputs.image }}" >/dev/null 2>&1 && echo hit=true >>"$GITHUB_OUTPUT" || true
      - if: steps.cached.outputs.hit != 'true'
        run: |
          make kernel KERNEL_VERSION=${{ steps.key.outputs.version }}
          docker tag "$REGISTRY/kernel:${{ steps.key.outputs.version }}" "${{ steps.key.outputs.image }}"
          docker push "${{ steps.key.outputs.image }}"
      - if: github.ref == 'refs/heads/main' # move kernel:<ver> to this build
        run: docker buildx imagetools create -t "$REGISTRY/kernel:${{ steps.key.outputs.version }}" "${{ steps.key.outputs.image }}"

  image:
    needs: [lint, kernel]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write # release on tags
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: this commit's kernel, under the name limakit.yml uses
        run: |
          docker pull "${{ needs.kernel.outputs.image }}"
          docker tag "${{ needs.kernel.outputs.image }}" "$REGISTRY/kernel:${{ needs.kernel.outputs.version }}"
      - name: lima image
        run: |
          make lima-image
          tags="${{ github.sha }}"
          [ "${{ github.ref }}" = refs/heads/main ] && tags="$tags latest"
          [ "${{ github.ref_type }}" = tag ] && tags="$tags ${{ github.ref_name }}"
          if [ "${{ github.event_name }}" != pull_request ]; then
            for t in $tags; do docker tag "$REGISTRY/lima:latest" "$REGISTRY/lima:$t" && docker push "$REGISTRY/lima:$t"; done
          fi
      - run: make
      - run: cd out && sha256sum limakit-kernel limakit-squashfs.img | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limakit-${{ github.sha }}
          path: |
            out/limakit-kernel
            out/limakit-squashfs.img
            out/SHA256SUMS
          retention-days: 14
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | # lima.yaml pinned to this release's files
          base=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          sq=$(sha256sum out/limakit-squashfs.img | cut -d' ' -f1) k=$(sha256sum out/limakit-kernel | cut -d' ' -f1)
          sed -e "s|https://github.com/[^ ]*/releases/latest/download/|$base/|" lima.yaml |
            awk -v sq="$sq" -v k="$k" '{print} /location: .*limakit-squashfs.img/ {print "    digest: sha256:" sq} /location: .*limakit-kernel$/ {print "      digest: sha256:" k}' >out/lima.yaml
          gh release create "${{ github.ref_name }}" --generate-notes out/limakit-kernel out/limakit-squashfs.img out/SHA256SUMS out/lima.yaml
