minimumLimaVersion: 2.0.0
base:
  - template:_default/mounts # ~ read-only, /tmp/lima writable
vmType: vz
arch: aarch64
mountType: virtiofs # needs the custom kernel (CONFIG_VIRTIO_FS=y)
# Latest release. Each release also ships a lima.yaml pinned to its own URLs and digests;
# `make run` swaps in the locally built out/limakit-{squashfs.img,kernel}.
images:
  - location: https://github.com/ulm0/limakit/releases/latest/download/limakit-squashfs.img # read-only root, booted directly (no RAM disk)
    arch: aarch64
    kernel:
      location: https://github.com/ulm0/limakit/releases/latest/download/limakit-kernel
      cmdline: "console=hvc0 root=/dev/vda" # limakit.yml's cmdline + the root disk
disk: 60GiB # also holds docker data, /home and ssh host keys (after the squashfs); sparse on the host
cpus: 4
memory: 8GiB
containerd:
  system: false
  user: false
portForwards:
  - guestSocket: /var/run/docker.sock
    hostSocket: "{{.Dir}}/sock/docker.sock"
  - guestPort: 68 # dhcpcd's client socket, not a service
    guestIP: 0.0.0.0 # dhcpcd binds 0.0.0.0; the default 127.0.0.1 doesn't match it
    proto: udp
    ignore: true
